<style>
  :root{
    --bg: #FBF1F3;
    --bg-deep: #F5E1E7;
    --ink: #4A4750;
    --ink-soft: #8B8790;
    --rose: #EBA9C0;
    --rose-deep: #D67A98;
    --rose-card: #E9A9C4;
    --line: #E8D3DC;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cormorant Garamond', serif;
    line-height:1.7;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:70px 40px 120px;
  }

  .back-link{
    display:inline-block;
    font-size:19px;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    margin-bottom:40px;
  }
  .back-link:hover{ color:var(--rose-deep); }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(50px, 8vw, 88px);
    margin-bottom:12px;
    color:var(--ink);
    line-height:1.02;
  }

  .roles-subtitle{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:normal;
    font-size:22px;
    color:var(--rose-deep);
    margin-bottom:50px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(380px, 1fr));
    gap:40px;
  }

  .card{
    border-radius:0;
    overflow:hidden;
    background:var(--rose-card);
    box-shadow:0 10px 30px rgba(214,122,152,0.18);
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 36px rgba(214,122,152,0.26);
  }

  .card:active{
    transform:translateY(-1px) scale(0.99);
  }

  .card:active .card-body{
    filter:brightness(1.32) saturate(1.4);
    animation-duration:1.4s;
  }

  .card-preview{
    background:#fff;
    min-height:380px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
  }
  .card-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
  }
  .card-preview .placeholder{
    font-family:'Inter', sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--rose);
  }

  .card-body{
    padding:34px 34px 38px;
    color:#fff;
    background:linear-gradient(
      90deg,
      var(--rose-card) 0%,
      #F6D9E7 25%,
      var(--rose-card) 50%,
      var(--rose-card) 100%
    );
    background-size:300% 100%;
    animation:shimmerLight 7s ease-in-out infinite;
    transition:filter .25s ease;
  }

  @keyframes shimmerLight{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }

  .card-body h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:32px;
    margin-bottom:8px;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.15);
  }

  .card-body .tag{
    font-style:italic;
    font-size:18px;
    color:#ffffff;
    opacity:0.95;
    margin-bottom:16px;
    display:block;
  }

  .card-body .location{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    color:#fff;
    margin-bottom:16px;
  }

  .card-body .location svg{
    width:14px;
    height:14px;
    flex-shrink:0;
  }

  .card-body p{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:17px;
    line-height:1.6;
    letter-spacing:0.01em;
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,0.12);
  }

  .card-footer{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:16px;
    margin-top:24px;
  }

  .visit-link{
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    color:#fff;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .visit-link:hover{ opacity:0.85; }

  .paper-pill{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#fff;
    border:1.5px solid rgba(255,255,255,0.7);
    border-radius:0;
    padding:7px 18px;
  }
  .paper-pill:hover{
    background:rgba(255,255,255,0.15);
  }

  footer{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    padding:40px 0;
    text-align:center;
    font-size:16px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }

  @media (max-width:640px){
    .wrap{ padding:50px 24px 80px; }
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">Back</a>
  <h1>Research Companies</h1>
  <p class="roles-subtitle">Research Scientist · Founding Scientist</p>

  <div class="grid">

    <div class="card">
      <div class="card-preview"><img src="athenei logo.jpeg" alt="Athenei Biosciences"></div>
      <div class="card-body">
        <h3>Athenei Biosciences</h3>
        <span class="tag">Venture</span>
        <div class="location">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          Cambridge, United Kingdom
        </div>
        <p>Biological Superintelligence for Cellular Agriculture.</p>
        <div class="card-footer">
          <a class="paper-pill" href="https://atheneibiosciences.com/" target="_blank" rel="noopener">Website</a>
          <a class="paper-pill" href="#" target="_blank" rel="noopener">GitHub</a>
          <a class="paper-pill" href="https://atheneibiosciences.com/#research" target="_blank" rel="noopener">Research</a>
        </div>
      </div>
    </div>

  </div>
</div>

<footer>
  © Copyright 2026 Jimena Segura.
</footer>
