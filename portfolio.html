<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex Labs — Jimena Segura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF1F3;
    --bg-deep: #F6E1E7;
    --ink: #3B2430;
    --ink-soft: #8C6B78;
    --rose: #EBA9C0;
    --rose-deep: #C06A88;
    --line: #EACBD4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.7;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:70px 40px 120px;
  }

  .back-link{
    display:inline-block;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:40px;
    border-bottom:1px solid var(--rose);
    padding-bottom:2px;
  }
  .back-link:hover{ color:var(--rose-deep); border-color:var(--rose-deep); }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(36px, 5vw, 54px);
    margin-bottom:14px;
    color:var(--ink);
  }

  .subtitle{
    font-size:16px;
    color:var(--ink-soft);
    margin-bottom:50px;
    max-width:520px;
  }

  .logo-title{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin-bottom:10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:22px;
  }

  .box{
    border:1px solid var(--line);
    background:#fff;
    border-radius:14px;
    padding:26px 22px;
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:border-color .2s ease, transform .2s ease;
  }
  .box:hover{ border-color:var(--rose-deep); transform:translateY(-3px); }

  .box .num{
    font-family:'Inter', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--rose-deep);
    text-transform:uppercase;
  }

  .box h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
    margin-top:14px;
  }

  @media (max-width:640px){
    .wrap{ padding:50px 24px 80px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">← Back</a>
  <img class="logo-title" src="cortex-labs-logo.png" alt="Cortex Labs">
  <p class="subtitle">Reimagining the world with biologically inspired research.</p>

  <div class="grid">
    <div class="box"><span class="num">01</span><h3>Project 01</h3></div>
    <div class="box"><span class="num">02</span><h3>Project 02</h3></div>
    <div class="box"><span class="num">03</span><h3>Project 03</h3></div>
    <div class="box"><span class="num">04</span><h3>Project 04</h3></div>
    <div class="box"><span class="num">05</span><h3>Project 05</h3></div>
    <div class="box"><span class="num">06</span><h3>Project 06</h3></div>
    <div class="box"><span class="num">07</span><h3>Project 07</h3></div>
    <div class="box"><span class="num">08</span><h3>Project 08</h3></div>
    <div class="box"><span class="num">09</span><h3>Project 09</h3></div>
    <div class="box"><span class="num">10</span><h3>Project 10</h3></div>
    <div class="box"><span class="num">11</span><h3>Project 11</h3></div>
    <div class="box"><span class="num">12</span><h3>Project 12</h3></div>
    <div class="box"><span class="num">13</span><h3>Project 13</h3></div>
    <div class="box"><span class="num">14</span><h3>Project 14</h3></div>
  </div>
</div>

</body>
</html>
